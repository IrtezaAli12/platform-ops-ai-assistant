apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 50Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 100Mi
          command:
            - sh
            - -c
            - |
              echo "Starting worker..."
              echo "Connecting to database..."
              if [ -z "$DATABASE_URL" ]; then
                echo "ERROR: DATABASE_URL is not set, cannot connect to database"
                exit 1
              fi
              sleep 3600
