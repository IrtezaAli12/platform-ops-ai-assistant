[project]
name = "platform-ops-ai-assistant"
version = "0.1.0"
description = "Read-only MCP server and Claude agent for troubleshooting Kubernetes"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.3,<3",
    "anthropic>=1.15,<2",
    "psycopg[binary]>=3.3,<4",
    "pgvector>=0.5,<1",
    "fastembed>=0.9,<1",
    "truststore>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server", "agent", "rag"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# E/W: style errors and warnings, F: likely bugs (unused imports, undefined names),
# I: sorted imports, B: common bug patterns, UP: modern Python syntax
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# rag.py imports some libraries after truststore.inject_into_ssl() on purpose,
# so their HTTPS downloads use the operating system's certificate list.
"rag.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
